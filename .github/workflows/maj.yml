# Toutes les heures : récupère les jeux gratuits, ajoute notes et traductions, republie le site.
name: Mise à jour et publication

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # pour enregistrer data/cache.json (notes et traductions déjà faites)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/update.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Enregistrer le cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache.json
          git diff --cached --quiet || (git commit -m "Mise à jour du cache [skip ci]" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploiement
        uses: actions/deploy-pages@v4
      # Après la publication : si une source a cassé, l'automatisation est marquée en échec
      # et GitHub t'envoie un e-mail (le site, lui, est déjà à jour avec les autres sources).
      - name: Vérifier la santé des sources
        run: |
          if [ -s data/alertes.txt ]; then
            echo "::error::Une ou plusieurs sources de jeux ne répondent plus :"
            cat data/alertes.txt
            exit 1
          fi
